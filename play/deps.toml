# Runtime dependencies for upgrade-impact-triage.
#
# This is the whole list. Every step is standard-library Python -- json, os,
# re, sys, time, urllib and nothing else -- so there is no install step and
# nothing to resolve beyond the interpreter itself.
#
# [[tools.install]] is not optional. `rote play release` reports a required
# tool with no install candidate as a share blocker, and it is right to: a
# recipient without python3 otherwise learns they are blocked and nothing about
# how to proceed. One entry per manager that can supply it.
#
# GITHUB_TOKEN is deliberately NOT declared. It is optional -- it only raises
# the GitHub API rate limit from 60/hr to 5000/hr -- and leaving it undeclared
# is what lets `rote play inspect` report "Authentication: none". Without it
# the Play still runs and simply reports more REVIEW rows.

schema_version = 1

[[tools]]
id = "python3"
command = "python3"
required = true
version_requirement = ">=3.8"

[[tools.install]]
manager = "brew"
package = "python@3"

[[tools.install]]
manager = "apt"
package = "python3"
